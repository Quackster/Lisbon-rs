[workspace]
resolver = "2"
members = [
    "lisbon-server",
    "lisbon-web",
]

[workspace.package]
version = "1.6.0"
edition = "2021"
license = "MIT"
authors = ["Lisbon Team"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"
arc-swap = "1"
parking_lot = "0.12"
sqlx = { version = "0.7", default-features = false, features = [
    "mysql",
    "runtime-tokio",
    "chrono",
] }
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.21"
regex = "1"
thiserror = "1"
lazy_static = "1"

# Web module
axum = { version = "0.6", features = ["macros"] }
image = "0.24"
lettre = "0.10"
argon2 = "0.5"
tower = "0.4"
http = "0.2"
tera = "1"
scraper = "0.17"
urlencoding = "2"
unicode-normalization = "0.1"
roxmltree = "0.20"
ini = "1"
